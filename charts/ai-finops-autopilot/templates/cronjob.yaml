apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-evaluator
  labels:
    app.kubernetes.io/name: ai-finops-autopilot
spec:
  schedule: {{ .Values.schedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: evaluator
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["/evidence/input.json", "--output", "/output"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: evidence
                  mountPath: /evidence
                  readOnly: true
                - name: output
                  mountPath: /output
          volumes:
            - name: evidence
              configMap:
                name: {{ .Values.evidenceConfigMap }}
            - name: output
              emptyDir: {}
